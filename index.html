<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Panel (login con mail) — Escabiando Pociones</title>
<style>
  :root {
    --bg: #171a33; --bg-elevated: #262b52; --bg-card: #2c3160; --line: #40447a;
    --cyan: #86e6f6; --pink: #fa7fb7; --pink-hot: #f25481; --purple: #6047eb;
    --ink: #f4f3ff; --ink-dim: #b7bce0;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; background: var(--bg); color: var(--ink);
    font-family: system-ui, sans-serif; padding: 24px;
  }
  .center { display: flex; align-items: center; justify-content: center; min-height: 90vh; }
  .card {
    background: var(--bg-card); border: 1px solid var(--line); border-radius: 8px; padding: 32px;
  }
  .login-card { width: 100%; max-width: 380px; }
  h1 { font-size: 1.3rem; margin: 0 0 6px; }
  h2 { font-size: 1.1rem; margin: 28px 0 14px; }
  p.sub { color: var(--ink-dim); font-size: 0.9rem; margin: 0 0 24px; }
  label { display: block; font-size: 0.85rem; color: var(--ink-dim); margin-bottom: 6px; }
  input, textarea {
    width: 100%; background: var(--bg-elevated); border: 1px solid var(--line);
    border-radius: 6px; color: var(--ink); padding: 10px 12px; font-size: 0.95rem; margin-bottom: 16px;
    font-family: inherit;
  }
  textarea { min-height: 140px; resize: vertical; }
  button {
    background: linear-gradient(135deg, var(--purple), var(--pink-hot));
    color: var(--ink); border: none; border-radius: 6px; padding: 11px 18px; font-size: 0.9rem;
    cursor: pointer; font-weight: 600;
  }
  button.ghost { background: var(--bg-elevated); border: 1px solid var(--line); }
  button:disabled { opacity: 0.6; cursor: default; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
  .msg { font-size: 0.85rem; margin: 14px 0; padding: 10px 12px; border-radius: 6px; }
  .msg-err { background: rgba(242,84,129,0.1); border: 1px solid var(--pink-hot); color: var(--pink); }
  .msg-ok { background: rgba(134,230,246,0.1); border: 1px solid var(--cyan); color: var(--cyan); }
  .hidden { display: none; }
  .container { max-width: 760px; margin: 0 auto; }
  .top-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
  .tabs { display: flex; gap: 10px; margin-bottom: 20px; }
  .tab-btn {
    background: var(--bg-elevated); border: 1px solid var(--line); color: var(--ink-dim);
    padding: 9px 16px; border-radius: 6px; cursor: pointer; font-size: 0.9rem;
  }
  .tab-btn.active { color: var(--ink); border-color: var(--cyan); }
  .entry-row {
    display: flex; justify-content: space-between; align-items: center; gap: 10px;
    padding: 12px 14px; border: 1px solid var(--line); border-radius: 6px; margin-bottom: 8px;
  }
  .entry-row small { color: var(--ink-dim); display: block; margin-top: 2px; }
  .badge { font-size: 0.7rem; padding: 2px 8px; border-radius: 20px; margin-left: 8px; }
  .badge-draft { background: rgba(250,127,183,0.15); color: var(--pink); border: 1px solid var(--pink-hot); }
  .badge-live { background: rgba(134,230,246,0.15); color: var(--cyan); border: 1px solid var(--cyan); }
  .form-box { border-top: 1px solid var(--line); padding-top: 20px; margin-top: 20px; }
  .checkbox-row { display: flex; align-items: center; gap: 8px; margin-bottom: 16px; }
  .checkbox-row input { width: auto; margin: 0; }
</style>
</head>
<body>

<!-- ===================== LOGIN ===================== -->
<div id="login-screen" class="center">
  <div class="card login-card">
    <h1>Panel de carga</h1>
    <p class="sub">Entrá con tu mail y contraseña.</p>
    <label>Mail</label>
    <input type="email" id="email" autocomplete="email">
    <label>Contraseña</label>
    <input type="password" id="password" autocomplete="current-password">
    <button id="login-btn" onclick="login()" style="width:100%;">Entrar</button>
    <div id="login-msg"></div>
  </div>
</div>

<!-- ===================== PANEL ===================== -->
<div id="app-screen" class="hidden container">
  <div class="top-row">
    <div>
      <h1 style="margin-bottom:2px;">Panel de carga</h1>
      <p class="sub" id="user-email" style="margin:0;"></p>
    </div>
    <button class="ghost" onclick="logout()">Cerrar sesión</button>
  </div>

  <div id="global-msg"></div>

  <div class="tabs">
    <button class="tab-btn active" id="tab-reviews-btn" onclick="switchTab('reviews')">Reviews</button>
    <button class="tab-btn" id="tab-noticias-btn" onclick="switchTab('noticias')">Noticias</button>
  </div>

  <!-- ---------- REVIEWS ---------- -->
  <div id="tab-reviews">
    <div id="reviews-list"></div>

    <div class="form-box">
      <h2 id="r-form-title">Agregar nueva review</h2>
      <label>Título de la review</label>
      <input type="text" id="r-title" oninput="autoSlug('r')">
      <label>Juego</label>
      <input type="text" id="r-game">
      <label>Slug (parte de la URL)</label>
      <input type="text" id="r-slug">
      <label>Puntaje (0 a 10)</label>
      <input type="number" id="r-score" min="0" max="10" step="0.5">
      <label>Resumen corto</label>
      <textarea id="r-excerpt" style="min-height:70px;"></textarea>
      <label>Texto completo (admite markdown)</label>
      <textarea id="r-body"></textarea>
      <label>Autor/a</label>
      <input type="text" id="r-author">
      <div class="checkbox-row">
        <input type="checkbox" id="r-draft">
        <label style="margin:0;">Guardar como borrador (no se muestra en la web)</label>
      </div>
      <div class="row">
        <button onclick="saveReview()">Guardar</button>
        <button class="ghost hidden" id="r-cancel-btn" onclick="resetReviewForm()">Cancelar edición</button>
      </div>
    </div>
  </div>

  <!-- ---------- NOTICIAS ---------- -->
  <div id="tab-noticias" class="hidden">
    <div id="noticias-list"></div>

    <div class="form-box">
      <h2 id="n-form-title">Agregar nueva noticia</h2>
      <label>Título</label>
      <input type="text" id="n-title" oninput="autoSlug('n')">
      <label>Slug (parte de la URL)</label>
      <input type="text" id="n-slug">
      <label>Resumen corto</label>
      <textarea id="n-excerpt" style="min-height:70px;"></textarea>
      <label>Texto completo (admite markdown)</label>
      <textarea id="n-body"></textarea>
      <label>Autor/a</label>
      <input type="text" id="n-author">
      <div class="checkbox-row">
        <input type="checkbox" id="n-draft">
        <label style="margin:0;">Guardar como borrador (no se muestra en la web)</label>
      </div>
      <div class="row">
        <button onclick="saveNoticia()">Guardar</button>
        <button class="ghost hidden" id="n-cancel-btn" onclick="resetNoticiaForm()">Cancelar edición</button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  // Datos reales de tu proyecto de Supabase (escabiando-pociones-auth).
  const SUPABASE_URL = "https://mmhzgamixbnawbjhmagt.supabase.co";
  const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1taHpnYW1peGJuYXdiamhtYWd0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc3ODMyOTUsImV4cCI6MjEwMzM1OTI5NX0.sSxZWLnwAG3yzGrsQUJgOgWPbruVoTyslxSXVij89EY";

  const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  let editingReviewSlug = null;
  let editingNoticiaSlug = null;

  // ---------- Login ----------

  async function login() {
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const btn = document.getElementById('login-btn');
    const msg = document.getElementById('login-msg');
    msg.innerHTML = '';
    btn.disabled = true;
    btn.textContent = 'Entrando…';

    const { data, error } = await supabase.auth.signInWithPassword({ email, password });

    btn.disabled = false;
    btn.textContent = 'Entrar';

    if (error) {
      msg.innerHTML = `<div class="msg msg-err">${error.message}</div>`;
      return;
    }
    showApp(data.user);
  }

  // Enter en cualquiera de los dos campos dispara el login, como un form normal.
  document.getElementById('password').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') login();
  });
  document.getElementById('email').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') document.getElementById('password').focus();
  });

  async function logout() {
    await supabase.auth.signOut();
    document.getElementById('app-screen').classList.add('hidden');
    document.getElementById('login-screen').classList.remove('hidden');
    document.getElementById('email').value = '';
    document.getElementById('password').value = '';
  }

  function showApp(user) {
    document.getElementById('login-screen').classList.add('hidden');
    document.getElementById('app-screen').classList.remove('hidden');
    document.getElementById('user-email').textContent = user.email;
    document.getElementById('r-author').value = document.getElementById('r-author').value || user.email;
    document.getElementById('n-author').value = document.getElementById('n-author').value || user.email;
    renderReviews();
    renderNoticias();
  }

  supabase.auth.getSession().then(({ data }) => {
    if (data.session) showApp(data.session.user);
  });

  // ---------- Llamada a la Edge Function ----------

  async function callFn(payload) {
    const { data, error } = await supabase.functions.invoke('save-content', { body: payload });
    if (error) throw new Error(error.message || 'Error de conexión con la función');
    if (data && data.error) throw new Error(data.error);
    return data;
  }

  function slugify(str) {
    return (str || '').toLowerCase()
      .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
      .replace(/[^a-z0-9]+/g, '-')
      .replace(/(^-|-$)/g, '');
  }

  function autoSlug(prefix) {
    const editing = prefix === 'r' ? editingReviewSlug : editingNoticiaSlug;
    if (editing) return;
    document.getElementById(`${prefix}-slug`).value = slugify(document.getElementById(`${prefix}-title`).value);
  }

  function switchTab(name) {
    document.getElementById('tab-reviews').classList.toggle('hidden', name !== 'reviews');
    document.getElementById('tab-noticias').classList.toggle('hidden', name !== 'noticias');
    document.getElementById('tab-reviews-btn').classList.toggle('active', name === 'reviews');
    document.getElementById('tab-noticias-btn').classList.toggle('active', name === 'noticias');
  }

  function showGlobalMsg(text, ok) {
    const el = document.getElementById('global-msg');
    el.innerHTML = `<div class="msg ${ok ? 'msg-ok' : 'msg-err'}">${text}</div>`;
    if (ok) setTimeout(() => { el.innerHTML = ''; }, 5000);
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str || '';
    return div.innerHTML;
  }

  // ---------- Reviews ----------

  async function renderReviews() {
    const list = document.getElementById('reviews-list');
    list.innerHTML = '<p style="color:var(--ink-dim);">Cargando…</p>';
    try {
      const { items } = await callFn({ action: 'list', path: 'content/reviews' });
      if (!items.length) {
        list.innerHTML = '<p style="color:var(--ink-dim);">Todavía no hay reviews.</p>';
        return;
      }
      const rows = await Promise.all(items.map(async (it) => {
        const { content } = await callFn({ action: 'get', path: it.path });
        return { slug: it.slug, ...content };
      }));
      list.innerHTML = rows.map(r => `
        <div class="entry-row">
          <div>
            <strong>${escapeHtml(r.title)}</strong>
            <span class="badge ${r.draft ? 'badge-draft' : 'badge-live'}">${r.draft ? 'Borrador' : 'Publicada'}</span>
            <small>${escapeHtml(r.game || '')} ${r.score != null ? '· ' + r.score + '/10' : ''}</small>
          </div>
          <div class="row" style="margin:0;">
            <button class="ghost" onclick='editReview(${JSON.stringify(r.slug)})'>Editar</button>
            <button class="ghost" onclick='deleteReview(${JSON.stringify(r.slug)})'>Borrar</button>
          </div>
        </div>
      `).join('');
    } catch (e) {
      list.innerHTML = `<div class="msg msg-err">Error al cargar: ${e.message}</div>`;
    }
  }

  async function editReview(slug) {
    try {
      const { content } = await callFn({ action: 'get', path: `content/reviews/${slug}.json` });
      editingReviewSlug = slug;
      document.getElementById('r-title').value = content.title || '';
      document.getElementById('r-game').value = content.game || '';
      document.getElementById('r-slug').value = slug;
      document.getElementById('r-score').value = content.score != null ? content.score : '';
      document.getElementById('r-excerpt').value = content.excerpt || '';
      document.getElementById('r-body').value = content.body || '';
      document.getElementById('r-author').value = content.author || '';
      document.getElementById('r-draft').checked = !!content.draft;
      document.getElementById('r-form-title').textContent = `Editando: ${content.title}`;
      document.getElementById('r-cancel-btn').classList.remove('hidden');
      document.getElementById('r-title').scrollIntoView({ behavior: 'smooth' });
    } catch (e) {
      showGlobalMsg('Error al abrir para editar: ' + e.message, false);
    }
  }

  function resetReviewForm() {
    editingReviewSlug = null;
    ['r-title','r-game','r-slug','r-score','r-excerpt','r-body'].forEach(id => document.getElementById(id).value = '');
    document.getElementById('r-draft').checked = false;
    document.getElementById('r-form-title').textContent = 'Agregar nueva review';
    document.getElementById('r-cancel-btn').classList.add('hidden');
  }

  async function saveReview() {
    const title = document.getElementById('r-title').value.trim();
    const slug = document.getElementById('r-slug').value.trim() || slugify(title);
    if (!title || !slug) { showGlobalMsg('Falta el título.', false); return; }

    const entry = {
      title,
      game: document.getElementById('r-game').value.trim(),
      score: document.getElementById('r-score').value !== '' ? parseFloat(document.getElementById('r-score').value) : null,
      excerpt: document.getElementById('r-excerpt').value.trim(),
      body: document.getElementById('r-body').value.trim(),
      author: document.getElementById('r-author').value.trim(),
      date: new Date().toISOString(),
      draft: document.getElementById('r-draft').checked
    };

    try {
      await callFn({
        action: 'put',
        path: `content/reviews/${slug}.json`,
        content: JSON.stringify(entry, null, 2),
        message: `${editingReviewSlug ? 'Editar' : 'Nueva'} review: ${title}`
      });
      showGlobalMsg('Guardado. El sitio se actualiza en un rato corto.', true);
      resetReviewForm();
      renderReviews();
    } catch (e) {
      showGlobalMsg('Error al guardar: ' + e.message, false);
    }
  }

  async function deleteReview(slug) {
    if (!confirm('¿Borrar esta review?')) return;
    try {
      await callFn({ action: 'delete', path: `content/reviews/${slug}.json`, message: `Borrar review: ${slug}` });
      showGlobalMsg('Borrada.', true);
      renderReviews();
    } catch (e) {
      showGlobalMsg('Error al borrar: ' + e.message, false);
    }
  }

  // ---------- Noticias ----------

  async function renderNoticias() {
    const list = document.getElementById('noticias-list');
    list.innerHTML = '<p style="color:var(--ink-dim);">Cargando…</p>';
    try {
      const { items } = await callFn({ action: 'list', path: 'content/noticias' });
      if (!items.length) {
        list.innerHTML = '<p style="color:var(--ink-dim);">Todavía no hay noticias.</p>';
        return;
      }
      const rows = await Promise.all(items.map(async (it) => {
        const { content } = await callFn({ action: 'get', path: it.path });
        return { slug: it.slug, ...content };
      }));
      list.innerHTML = rows.map(n => `
        <div class="entry-row">
          <div>
            <strong>${escapeHtml(n.title)}</strong>
            <span class="badge ${n.draft ? 'badge-draft' : 'badge-live'}">${n.draft ? 'Borrador' : 'Publicada'}</span>
          </div>
          <div class="row" style="margin:0;">
            <button class="ghost" onclick='editNoticia(${JSON.stringify(n.slug)})'>Editar</button>
            <button class="ghost" onclick='deleteNoticia(${JSON.stringify(n.slug)})'>Borrar</button>
          </div>
        </div>
      `).join('');
    } catch (e) {
      list.innerHTML = `<div class="msg msg-err">Error al cargar: ${e.message}</div>`;
    }
  }

  async function editNoticia(slug) {
    try {
      const { content } = await callFn({ action: 'get', path: `content/noticias/${slug}.json` });
      editingNoticiaSlug = slug;
      document.getElementById('n-title').value = content.title || '';
      document.getElementById('n-slug').value = slug;
      document.getElementById('n-excerpt').value = content.excerpt || '';
      document.getElementById('n-body').value = content.body || '';
      document.getElementById('n-author').value = content.author || '';
      document.getElementById('n-draft').checked = !!content.draft;
      document.getElementById('n-form-title').textContent = `Editando: ${content.title}`;
      document.getElementById('n-cancel-btn').classList.remove('hidden');
      document.getElementById('n-title').scrollIntoView({ behavior: 'smooth' });
    } catch (e) {
      showGlobalMsg('Error al abrir para editar: ' + e.message, false);
    }
  }

  function resetNoticiaForm() {
    editingNoticiaSlug = null;
    ['n-title','n-slug','n-excerpt','n-body'].forEach(id => document.getElementById(id).value = '');
    document.getElementById('n-draft').checked = false;
    document.getElementById('n-form-title').textContent = 'Agregar nueva noticia';
    document.getElementById('n-cancel-btn').classList.add('hidden');
  }

  async function saveNoticia() {
    const title = document.getElementById('n-title').value.trim();
    const slug = document.getElementById('n-slug').value.trim() || slugify(title);
    if (!title || !slug) { showGlobalMsg('Falta el título.', false); return; }

    const entry = {
      title,
      excerpt: document.getElementById('n-excerpt').value.trim(),
      body: document.getElementById('n-body').value.trim(),
      author: document.getElementById('n-author').value.trim(),
      date: new Date().toISOString(),
      draft: document.getElementById('n-draft').checked
    };

    try {
      await callFn({
        action: 'put',
        path: `content/noticias/${slug}.json`,
        content: JSON.stringify(entry, null, 2),
        message: `${editingNoticiaSlug ? 'Editar' : 'Nueva'} noticia: ${title}`
      });
      showGlobalMsg('Guardado. El sitio se actualiza en un rato corto.', true);
      resetNoticiaForm();
      renderNoticias();
    } catch (e) {
      showGlobalMsg('Error al guardar: ' + e.message, false);
    }
  }

  async function deleteNoticia(slug) {
    if (!confirm('¿Borrar esta noticia?')) return;
    try {
      await callFn({ action: 'delete', path: `content/noticias/${slug}.json`, message: `Borrar noticia: ${slug}` });
      showGlobalMsg('Borrada.', true);
      renderNoticias();
    } catch (e) {
      showGlobalMsg('Error al borrar: ' + e.message, false);
    }
  }
</script>

</body>
</html>
